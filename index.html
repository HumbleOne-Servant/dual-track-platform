<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System Path Verification</title>
</head>
<body style="font-family:sans-serif; background:#f3f4f6; padding:40px; color:#1f2937;">
    <h2>🔄 Dual-Track System Verification Pipeline</h2>
    <p>Testing direct folder mapping layout...</p>
    
    <div id="reportBox" style="background:#fff; padding:20px; border-radius:8px; border:1px solid #e5e7eb; font-family:monospace; white-space:pre-wrap;">Connecting to storage files...</div>

    <script>
        async function runDiagnosticFetch() {
            const reportBox = document.getElementById("reportBox");
            
            // TARGET LINK: Direct path mapping route to your first lesson file node
            const testPath = "curriculum/grade_5/mathematics/day_1.json";
            
            try {
                const response = await fetch(testPath);
                if (!response.ok) throw new Error(`Server returned code: ${response.status}`);
                
                const data = await response.json();
                reportBox.style.color = "#16a34a";
                reportBox.innerText = `🟢 SUCCESS! File connected.\nLesson Title: ${data.title}\nSync Hash Vector: ${data.sync_hash}`;
            } catch (err) {
                reportBox.style.color = "#dc2626";
                reportBox.innerText = `🔴 CONNECTION BLOCKED\nPath attempted: ${testPath}\nReason: ${err.message}\n\nTroubleshooting:\n1. Open your 'curriculum' folder.\n2. Confirm the subfolder names match 'grade_5' and 'mathematics' in all lowercase letters exactly.`;
            }
        }
        window.onload = runDiagnosticFetch;
    </script>
</body>
</html>
