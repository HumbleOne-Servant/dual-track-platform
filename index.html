<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual-Ledger Adaptive Platform Framework</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #121212;
            color: #e0e0e0;
        }
        header {
            background-color: #1f1f1f;
            padding: 15px;
            border-bottom: 2px solid #333;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        select, button {
            background-color: #2d2d2d;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        button {
            background-color: #007acc;
            font-weight: bold;
        }
        button:hover {
            background-color: #0062a3;
        }
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .panel-left {
            flex: 1;
            border-right: 2px solid #333;
            background-color: #fff;
            position: relative;
        }
        .panel-left iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .panel-right {
            width: 400px;
            background-color: #181818;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .status-badge {
            align-self: flex-start;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-connecting { background-color: #d97706; color: #fff; }
        .status-synced { background-color: #16a34a; color: #fff; }
        .status-error { background-color: #dc2626; color: #fff; }
        
        .ledger-box {
            background-color: #222;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 6px;
        }
        .ledger-box h3 { margin-top: 0; color: #007acc; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .hash-tag { font-family: monospace; color: #38bdf8; word-break: break-all; }
        .placeholder-text { color: #888; font-style: italic; }
    </style>
</head>
<body>

    <header>
        <select id="gradeSelect">
            <option value="Grade 1">Grade 1</option>
            <option value="Grade 2">Grade 2</option>
            <option value="Grade 3">Grade 3</option>
        </select>
        <select id="subjectSelect">
            <option value="Math">Math</option>
            <option value="Science">Science</option>
            <option value="History">History</option>
        </select>
        <select id="daySelect">
            <option value="Day 1">Day 1</option>
            <option value="Day 2">Day 2</option>
            <option value="Day 3">Day 3</option>
        </select>
        <button onclick="syncPlatform()">Synchronize Ledger</button>
    </header>

    <div class="container">
        <!-- LEFT SIDE: Public Learning Node (Iframe) -->
        <div class="panel-left">
            <iframe id="publicIframe" src="about:blank"></iframe>
        </div>

        <!-- RIGHT SIDE: Private Forensic Ledger -->
        <div class="panel-right">
            <div id="statusIndicator" class="status-badge status-connecting">Connecting to live data stream core...</div>
            
            <div class="ledger-box">
                <h3>Parallel Research Text</h3>
                <p id="ledgerText" class="placeholder-text">Awaiting pipeline connection stabilization...</p>
            </div>

            <div class="ledger-box">
                <h3>Sync Hash Vector</h3>
                <p id="ledgerHash" class="hash-tag">0x00000000</p>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURATION: Replace this URL string with your actual live Render endpoint
        const BACKEND_URL = "https://your-render-app-name.onrender.com";

        async function syncPlatform() {
            const grade = document.getElementById('gradeSelect').value;
            const subject = document.getElementById('subjectSelect').value;
            const day = document.getElementById('daySelect').value;
            
            const statusIndicator = document.getElementById('statusIndicator');
            const ledgerText = document.getElementById('ledgerText');
            const ledgerHash = document.getElementById('ledgerHash');
            const publicIframe = document.getElementById('publicIframe');

            statusIndicator.className = "status-badge status-connecting";
            statusIndicator.innerText = "Synchronizing data pipelines...";

            // Properly format parameters into an standard internet address query layout
            const syncTargetUrl = `${BACKEND_URL}?grade=${encodeURIComponent(grade)}&subject=${encodeURIComponent(subject)}&day=${encodeURIComponent(day)}`;

            try {
                const response = await fetch(syncTargetUrl, { method: 'GET' });
                
                if (!response.ok) throw new Error(`Backend rejected response: ${response.status}`);
                
                const data = await response.json();

                // 1. Instantly trigger iframe to render dynamic open web asset path
                publicIframe.src = data.iframe_target;

                // 2. Populate the private forensic ledger tracking outputs
                ledgerText.innerText = data.ledger_payload.cross_reference;
                ledgerText.classList.remove('placeholder-text');
                ledgerHash.innerText = data.ledger_payload.sync_hash;

                // 3. Mark status window green
                statusIndicator.className = "status-badge status-synced";
                statusIndicator.innerText = "Ledger Synced";

            } catch (error) {
                console.error("Pipeline failure details:", error);
                statusIndicator.className = "status-badge status-error";
                statusIndicator.innerText = "Connection Broken";
                ledgerText.innerText = "Failed to pull research data from backend engine. Confirm backend is awake.";
                ledgerText.classList.add('placeholder-text');
                ledgerHash.innerText = "ERROR_NODE_TIMEOUT";
            }
        }

        // Run automatically on first bootup layout render
        window.onload = syncPlatform;
    </script>
</body>
</html>
