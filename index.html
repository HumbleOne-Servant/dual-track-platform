<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual-Track Learning Platform</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff; color: #1f2937;
            display: flex; height: 100vh; overflow: hidden;
        }
        .sidebar-rail {
            width: 65px; background-color: #ffffff; border-right: 1px solid #e5e7eb;
            display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 8px;
        }
        .hat-icon { font-size: 22px; margin-bottom: 20px; color: #111827; }
        .grade-item {
            width: 38px; height: 38px; border-radius: 50%; border: none;
            background: transparent; color: #4b5563; font-weight: 500; font-size: 13px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .grade-item.active { background-color: #111827; color: #ffffff; font-weight: 600; }
        .workspace-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header-strip { padding: 15px 30px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
        .header-strip h1 { margin: 0; font-size: 18px; font-weight: 700; color: #111827; }
        .days-counter { background-color: #f3f4f6; border: 1px solid #e5e7eb; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        .control-ribbon { padding: 12px 30px; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; gap: 12px; }
        .pill-container { display: flex; align-items: center; background-color: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 5px 12px; height: 36px; }
        .arrow-button { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        select { border: none; background: transparent; color: #111827; font-size: 13px; font-weight: 600; outline: none; cursor: pointer; }
        .dashboard-canvas { flex: 1; display: flex; background-color: #f9fafb; padding: 25px; gap: 25px; overflow: hidden; }
        .left-node-panel { width: 50%; background-color: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 30px; overflow-y: auto; }
        .right-ledger-panel { width: 50%; background-color: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; }
        .ledger-section-title { font-size: 11px; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.8px; }
        .ledger-card-body { background-color: #ffffff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; font-size: 13px; line-height: 1.6; }
        .hash-string { font-family: monospace; color: #0284c7; font-weight: 500; }
    </style>
</head>
<body>
    <nav class="sidebar-rail">
        <div class="hat-icon">🎓</div>
        <button class="grade-item" onclick="updateGrade('K', this)">K</button>
        <button class="grade-item" onclick="updateGrade('1', this)">1</button>
        <button class="grade-item" onclick="updateGrade('2', this)">2</button>
        <button class="grade-item" onclick="updateGrade('3', this)">3</button>
        <button class="grade-item" onclick="updateGrade('4', this)">4</button>
        <button class="grade-item active" onclick="updateGrade('5', this)">5</button>
        <button class="grade-item" onclick="updateGrade('6', this)">6</button>
        <button class="grade-item" onclick="updateGrade('7', this)">7</button>
        <button class="grade-item" onclick="updateGrade('8', this)">8</button>
        <button class="grade-item" onclick="updateGrade('9', this)">9</button>
        <button class="grade-item" onclick="updateGrade('10', this)">10</button>
        <button class="grade-item" onclick="updateGrade('11', this)">11</button>
        <button class="grade-item" onclick="updateGrade('12', this)">12</button>
    </nav>

    <div class="workspace-panel">
        <header class="header-strip">
            <h1>Dual-Track Learning Platform</h1>
            <div class="days-counter">📁 Local Server Active</div>
        </header>

        <section class="control-ribbon">
            <button class="arrow-button" onclick="changeDay(-1)">&lt;</button>
            <div class="pill-container"><select id="daySelect" onchange="loadLesson()"></select></div>
            <button class="arrow-button" onclick="changeDay(1)">&gt;</button>
            
            <div class="pill-container" style="margin-left: 8px;">
                <select id="subjectSelect" onchange="loadLesson()">
                    <option value="mathematics" selected>Mathematics</option>
                    <option value="science">Science</option>
                    <option value="language_arts">Language Arts</option>
                    <option value="history_social_studies">History / Social Studies</option>
                    <option value="biblical_studies">Biblical Studies</option>
                </select>
            </div>
        </section>

        <main class="dashboard-canvas">
            <div id="textbookDisplayPanel" class="left-node-panel"><p>Loading curriculum text files...</p></div>
            <div class="right-ledger-panel">
                <div><div class="ledger-section-title">Cross-References</div><div id="crossRefCard" class="ledger-card-body">Awaiting sync...</div></div>
                <div><div class="ledger-section-title">Structural Sync Hash</div><div id="hashCard" class="ledger-card-body hash-string">0x00000000</div></div>
            </div>
        </main>
    </div>

    <script>
        let currentGrade = "5";

        function initDays() {
            const select = document.getElementById("daySelect");
            select.innerHTML = "";
            for (let d = 1; d <= 180; d++) {
                let opt = document.createElement("option");
                opt.value = `day_${d}`; opt.innerText = `Day ${d} / 180`;
                select.appendChild(opt);
            }
        }

        function updateGrade(code, btn) {
            document.querySelectorAll('.grade-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentGrade = code;
            loadLesson();
        }

        function changeDay(dir) {
            const select = document.getElementById("daySelect");
            let next = select.selectedIndex + dir;
            if (next >= 0 && next < select.options.length) {
                select.selectedIndex = next;
                loadLesson();
            }
        }

        async function loadLesson() {
            const subject = document.getElementById("subjectSelect").value;
            const day = document.getElementById("daySelect").value;
            
            // Tries both lower and uppercase variants to bypass server case blocks permanently
            const path1 = `curriculum/grade_${currentGrade.toLowerCase()}/${subject}/${day}.json`;
            const path2 = `Curriculum/grade_${currentGrade.toLowerCase()}/${subject}/${day}.json`;

            async function tryFetch(url) {
                const res = await fetch(url);
                if (!res.ok) throw new Error();
                return res.json();
            }

            try {
                let data;
                try { data = await tryFetch(path1); } 
                catch (e) { data = await tryFetch(path2); }

                let bulletsHTML = data.bullets.map(b => `<li style="margin-bottom:8px;">${b}</li>`).join('');
                document.getElementById("textbookDisplayPanel").innerHTML = `
                    <h2 style="margin: 0 0 8px 0; font-size: 24px;">${data.title}</h2>
                    <p style="color: #6b7280; margin: 0 0 20px 0;">${data.description}</p>
                    <div style="border-left: 3px solid #e5e7eb; padding-left: 12px; margin-bottom: 20px; font-style: italic;">${data.concept}</div>
                    <ul style="padding-left: 20px; line-height: 1.6;">${bulletsHTML}</ul>`;
                document.getElementById("crossRefCard").innerText = data.cross_reference;
                document.getElementById("hashCard").innerText = data.sync_hash;
            } catch (err) {
                document.getElementById("textbookDisplayPanel").innerHTML = `<p style="color: #ef4444;">Lesson Data Offline</p><p style="color: #6b7280; font-size: 13px;">Ensure your unzipped folder sits in your repository.</p>`;
            }
        }

        window.onload = function() { initDays(); loadLesson(); };
    </script>
</body>
</html>
