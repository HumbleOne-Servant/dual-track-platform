<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual-Track Learning Hub</title>
</head>
<body style="margin: 0; padding: 0;">

<div id="learning-platform-container" style="background: #f0f8ff; min-height: 100vh; font-family: 'Comic Sans MS', sans-serif; padding-bottom: 40px; transition: background-color 0.3s ease;">
    
    <!-- Dynamic Header Bar changing colors based on selected grade -->
    <header id="dynamic-header-bar" style="background: linear-gradient(135deg, #ff7675, #6c5ce7); padding: 20px; display: flex; justify-content: space-between; align-items: center; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: background 0.3s ease;">
        <div style="font-size: 24px; font-weight: bold; letter-spacing: 2px;">🌟 DUAL-TRACK LEARNING HUB</div>
        <div style="display: flex; gap: 15px; align-items: center;">
            
            <select id="track-grade-selector" style="padding: 10px 20px; font-size: 16px; border-radius: 30px; font-weight: bold; background: #ffeaa7; cursor: pointer;">
                <option value="K-5">🖍️ Elementary Track (Grades K-5)</option>
                <option value="6-8">📘 Middle School Track (Grades 6-8)</option>
                <option value="9-12">🎓 High School Track (Grades 9-12)</option>
            </select>
            
            <select id="track-subject-selector" style="padding: 10px 20px; font-size: 16px; border-radius: 30px; font-weight: bold; background: #fab1a0; cursor: pointer;">
                <option value="math">🔢 Math Adventures</option>
                <option value="english">🔤 Reading & Words</option>
                <option value="science">🔬 Science Secrets</option>
                <option value="social studies">🌍 World History</option>
                <option value="electives">🎨 Creative Arts</option>
            </select>
            
            <!-- Upgraded Day Tracker from text label into a 180-Day Selection Dropdown Menu -->
            <select id="track-day-dropdown" style="padding: 10px 20px; font-size: 16px; border-radius: 30px; font-weight: bold; background: #55efc4; color: #2d3436; cursor: pointer;">
                <!-- Auto-populated by initialization script -->
            </select>
            
        </div>
    </header>

    <!-- Dynamic Learning Viewport -->
    <main id="adaptive-portal-viewport" style="max-width: 1200px; margin: 30px auto; padding: 20px; box-sizing: border-box;">
        <!-- Injected layout profiles load directly here -->
    </main>
</div>
<style>
/* K-5 Design Profiles */
.game-card-container { background: #ffffff; border: 5px solid #55efc4; border-radius: 35px; padding: 40px; text-align: center; box-shadow: 0 12px 25px rgba(0,0,0,0.08); }
.big-interactive-button { background: #0984e3; color: white; font-size: 22px; font-weight: bold; padding: 15px 40px; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 6px 0 #076bba; }

/* 6-8 Design Profiles */
.clean-teen-wrapper { background: #ffffff; min-height: 480px; padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
.teen-pipeline-card { background: #f8f9fa; border-radius: 12px; border-left: 6px solid #00a8ff; padding: 20px; margin-bottom: 15px; }
.teen-action-btn { background: #00a8ff; color: white; padding: 12px 30px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }

/* 9-12 Design Profiles */
.adult-workstation-wrapper { background: #ffffff; min-height: 520px; color: #2c3e50; display: grid; grid-template-columns: 240px 1fr; gap: 30px; border: 1px solid #dcdde1; border-radius: 16px; padding: 20px; }
.workstation-sidebar { background: #1e272e; color: #f5f6fa; padding: 25px; border-radius: 12px; display: flex; flex-direction: column; gap: 15px; }
.workstation-paper { background: #fdfefe; border: 1px solid #ced6e0; border-radius: 8px; padding: 35px; }
.workstation-btn { background: #2f3542; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; }
</style>
<script>
const THEME_PROFILES = {
    "K-5": {
        header: "linear-gradient(135deg, #ff7675, #6c5ce7)",
        background: "#f0f8ff",
        bodyFont: "'Comic Sans MS', sans-serif"
    },
    "6-8": {
        header: "linear-gradient(135deg, #2c3e50, #2980b9)",
        background: "#eef2f7",
        bodyFont: "sans-serif"
    },
    "9-12": {
        header: "linear-gradient(135deg, #1e272e, #485460)",
        background: "#ffffff",
        bodyFont: "serif"
    }
};

function applyGradeLevelLayoutTheme() {
    const selectedGrade = document.getElementById('track-grade-selector').value;
    const currentTheme = THEME_PROFILES[selectedGrade];
    const platformContainer = document.getElementById('learning-platform-container');
    const platformHeader = document.getElementById('dynamic-header-bar');
    
    if (platformContainer && platformHeader) {
        platformContainer.style.backgroundColor = currentTheme.background;
        platformContainer.style.fontFamily = currentTheme.bodyFont;
        platformHeader.style.background = currentTheme.header;
    }
}

function switchPortalLayout(incomingLessonData = null) {
    const selectedGrade = document.getElementById('track-grade-selector').value;
    document.getElementById('adaptive-portal-viewport').innerHTML = "";

    if (selectedGrade === 'K-5') {
        renderElementaryInterface(incomingLessonData);
    } else if (selectedGrade === '6-8') {
        renderMiddleSchoolInterface(incomingLessonData);
    } else if (selectedGrade === '9-12') {
        renderHighSchoolInterface(incomingLessonData);
    }
}
</script>
<script>
function renderElementaryInterface(data) {
    const viewport = document.getElementById('adaptive-portal-viewport');
    
    // Extract our new clean properties directly from your topic JSON file
    const title = data?.lesson_title || "Lesson Loading...";
    const coreText = data?.public_core_concept || "Awaiting database stream.";
    const topic = data?.topic_folder || "general";
    
    // Inject the interactive, student-facing lesson display layout
    viewport.innerHTML = `
        <div style="display: flex; flex-direction: column; align-items: center; gap: 25px;">
            <!-- Left Panel / Main Lesson Box -->
            <div class="game-card-container" style="width: 100%; max-width: 700px; border-color: #ff7675;">
                <div style="font-size: 50px; margin-bottom: 10px;">☀️🍂</div>
                <span style="background: #ffeaa7; color: #d63031; padding: 5px 15px; font-weight: bold; border-radius: 10px; font-size: 14px; text-transform: uppercase;">
                    Topic: ${topic.replace('_', ' ')}
                </span>
                <h2 style="font-size: 28px; color: #2d3436; margin: 15px 0;">${title}</h2>
                
                <!-- The Pure Academic Textbook Text Pane -->
                <p style="font-size: 18px; color: #2d3436; text-align: left; background: #fffdf0; padding: 25px; border-radius: 15px; line-height: 1.6; border: 2px dashed #ffeaa7;">
                    ${coreText}
                </p>
                
                <button class="big-interactive-button" onclick="playVoiceAssistance('${coreText.replace(/'/g, "\\'")}')">
                    🔊 Listen to Lesson Text
                </button>
            </div>
            
            <!-- Injected Assignment Container (Generated dynamically right below) -->
            <div id="generated-assignment-dock" style="width: 100%; max-width: 700px;">
                ${generateAssignmentModule(data)}
            </div>
        </div>
    `;
}

function playVoiceAssistance(textToSpeak) {
    // Standard web browser text-to-speech engine
    const speech = new SpeechSynthesisUtterance(textToSpeak);
    speech.rate = 0.9;
    window.speechSynthesis.speak(speech);
}
function generateAssignmentModule(data) {
    const topic = data?.topic_folder || "general";
    
    // Builds a targeted visual assignment based directly on the topic layer name
    if (topic === "weather_seasons") {
        return `
            <div class="game-card-container" style="border-color: #74b9ff; background: #f1f7ff;">
                <h3 style="color: #0984e3; margin-top: 0; font-size: 22px;">📝 Today's Creative Playground Assignment</h3>
                <p style="font-size: 16px; color: #4b4b4b;">Look out the window! Use your mouse or touchscreen inside the drawing box below to draw the active weather parameters you see outside right now.</p>
                
                <!-- Interactive Drawing Canvas Element for Young Learners -->
                <div style="background: white; border: 3px solid #74b9ff; border-radius: 15px; height: 200px; display: flex; align-items: center; justify-content: center; margin: 20px 0; color: #b2bec3; font-weight: bold; cursor: crosshair;" onclick="alert('Drawing tool activated!')">
                    🎨 [Click to Draw Clouds, Sun, or Rain Canvas]
                </div>
                
                <button class="big-interactive-button" style="background: #20bf6b; box-shadow: 0 6px 0 #1b8a4c;" onclick="alert('Assignment submitted successfully for teacher review!')">
                    🌟 Submit Drawing
                </button>
            </div>
        `;
    }
    
    // Default fallback assignment layout for general topics
    return `
        <div class="game-card-container" style="border-color: #a55eea;">
            <h3 style="color: #6f00ff; margin-top: 0;">📝 Lesson Reflection Assignment</h3>
            <p>Tell your parent one important variable or concept you discovered in today's lesson text.</p>
        </div>
    `;
}
function fetchCurriculumContent() {
    const currentGrade = document.getElementById('track-grade-selector').value;
    const currentSubject = document.getElementById('track-subject-selector').value;
    
    // Standard defaults mapping targets directly to your new deep folders
    let gradePath = "gk";
    if (currentGrade === "6-8") gradePath = "g5"; 
    if (currentGrade === "9-12") gradePath = "g12";

    // Hardcoded target to test Part 1 of your new weather_seasons folder structure safely
    const targetFileUrl = `/pure_curriculum_vault/${gradePath}/${currentSubject}/weather_seasons/lesson_1.json`;
    
    console.log("Requesting pure baseline data file asset: " + targetFileUrl);

    fetch(targetFileUrl)
        .then(response => {
            if (!response.ok) { throw new Error("Target file missing inside deep topic layers."); }
            return response.json();
        })
        .then(data => {
            switchPortalLayout(data);
        })
        .catch(error => {
            console.log("Empty layout path: " + error.message);
            switchPortalLayout(null);
        });
}
function renderMiddleSchoolInterface(data) {
    const viewport = document.getElementById('adaptive-portal-viewport');
    const subject = document.getElementById('track-subject-selector').value;
    
    const lessonHeading = data?.title || `Focus Lesson: ${subject.toUpperCase()}`;
    const coreConceptText = data?.public_core_concept || "Select an academic subject timeline from the selector keys above to fill your task logs.";
    
    // Extracted target data for the alternative matching framework highlights
    const biblicalProofText = data?.alignment_triggers?.parameters?.biblical_truth || "Awaiting dynamic data link...";
    const alternateFrameworkModel = data?.alignment_triggers?.parameters?.alternative_framework || "Analyzing alternative framework properties...";

    viewport.innerHTML = `
        <div class="clean-teen-wrapper">
            <div style="display: grid; grid-template-columns: 300px 1fr; gap: 25px;">
                <aside>
                    <h3 style="color: #2980b9; margin-top: 0;">📋 Progress Tracker</h3>
                    <div class="teen-pipeline-card" style="border-left-color: #4cd137;"><strong>✓ Core Target:</strong><br>${data?.subject || subject} Track</div>
                    <div class="teen-pipeline-card" style="border-left-color: #eccc68;"><strong>💡 Framework Sync:</strong><br>${alternateFrameworkModel}</div>
                </aside>
                <section style="background: white; padding: 30px; border-radius: 16px;">
                    <h2 style="color: #2c3e50; font-size: 24px; margin-top: 0;">${lessonHeading}</h2>
                    <p style="color: #718093; line-height: 1.6; font-size: 16px;">${coreConceptText}</p>
                    
                    <!-- Highlighted Alternative Framework Principle Box -->
                    <div style="margin-top: 25px; padding: 20px; background: #fff9db; border-left: 6px solid #fab1a0; border-radius: 4px; color: #2f3542;">
                        <h4 style="margin: 0 0 5px 0; color: #e67e22;">✨ Comparative Framework Principles</h4>
                        <p style="margin: 5px 0 0 0; font-style: italic;"><strong>Source Baseline:</strong> ${biblicalProofText}</p>
                    </div>
                </section>
            </div>
        </div>`;
}
function renderHighSchoolInterface(data) {
    const viewport = document.getElementById('adaptive-portal-viewport');
    
    const lessonHeading = data?.title || "Academic Syllabus Module - High School";
    const coreConceptText = data?.public_core_concept || "Select a targeted timeline element to synchronize active workstation nodes.";
    
    const biblicalProofText = data?.alignment_triggers?.parameters?.biblical_truth || "Awaiting source confirmation...";
    const alternateFrameworkModel = data?.alignment_triggers?.parameters?.alternative_framework || "Structural model trace pending.";
    const retentionPrompt = data?.retention_questions?.[0]?.text || "Complete required essay uploads inside the hub.";

    viewport.innerHTML = `
        <div class="adult-workstation-wrapper">
            <nav class="workstation-sidebar">
                <strong style="font-size: 14px; color: #747d8c; letter-spacing: 1px;">SYLLABUS PORTAL</strong>
                <a href="#" style="color: white; text-decoration: none;">📊 Main Dashboard</a>
                <a href="#" style="color: #a4b0be; text-decoration: none;">📖 Course Readings</a>
            </nav>
            <main class="workstation-paper">
                <h2 style="margin-top: 0; font-size: 26px; color: #1e272e; border-bottom: 2px solid #f1f2f6; padding-bottom: 10px;">${lessonHeading}</h2>
                <p style="line-height: 1.8; font-size: 16px; color: #2f3542;">${coreConceptText}</p>
                
                <!-- Professional Advanced Framework Pane -->
                <div style="background: #f1f2f6; padding: 20px; border-radius: 6px; font-size: 15px; margin-bottom: 25px; border-left: 4px solid #2c3e50;">
                    <strong style="color: #2c3e50;">⚖️ Analytical Comparison Models:</strong>
                    <p style="margin: 5px 0;"><strong>Historical Framework:</strong> ${alternateFrameworkModel}</p>
                    <p style="margin: 5px 0 0 0; font-size: 13px; color: #57606f;">References: ${biblicalProofText}</p>
                </div>
                
                <div style="border: 2px dashed #ced6e0; padding: 25px; text-align: center; border-radius: 6px; background: #ffffff;">
                    <p style="margin: 0 0 15px 0; font-size: 14px; color: #747d8c;"><strong>Required Output:</strong> ${retentionPrompt}</p>
                    <button class="workstation-btn">Upload Assignment Asset</button>
                </div>
            </main>
        </div>`;
}
</script>
<script>
function fetchCurriculumContent() {
    const currentGrade = document.getElementById('track-grade-selector').value;
    const currentSubject = document.getElementById('track-subject-selector').value;
    const currentDay = document.getElementById('track-day-dropdown').value;

    // 1. Determine the broad layout bucket folder where the file lives
    let folderBucket = "k5";
    if (currentGrade === "6-8") { folderBucket = "68"; }
    else if (currentGrade === "9-12") { folderBucket = "912"; }

    // 2. Determine the exact grade prefix tag matching your folder structure
    let exactGradePrefix = "gk";
    if (currentGrade === "K-5") {
        // If the student selects the K-5 track, we need to map to the active day subtrack grade
        // For testing/initial load, we fallback to gk, or dynamically detect the active student row
        exactGradePrefix = "gk"; 
    } else if (currentGrade === "6-8") {
        // Map out the middle school sequence based on your dropdown context tags
        exactGradePrefix = "g6"; 
    } else if (currentGrade === "9-12") {
        // Map out the high school sequence based on your dropdown context tags
        exactGradePrefix = "g9";
    }

    // 3. Map out the clean subject name variations to match your files
    let subjectTag = "science";
    if (currentSubject === "math") { subjectTag = "math"; }
    else if (currentSubject === "english") { subjectTag = "reading"; }
    else if (currentSubject === "social studies") { subjectTag = "social_studies"; }
    else if (currentSubject === "electives") { subjectTag = "biblical"; }

    // 4. Build the precise file path: e.g., /backend_vault/k5/gk_science_day_1.json
    const targetFileUrl = `/backend_vault/${folderBucket}/${exactGradePrefix}_${subjectTag}_day_${currentDay}.json`;
    
    console.log("Requesting backend asset node location: " + targetFileUrl);

    fetch(targetFileUrl)
        .then(response => {
            if (!response.ok) { throw new Error("Target file was not found inside unique layout vaults."); }
            return response.json();
        })
        .then(data => {
            // Render the text content inside the custom age viewports smoothly
            switchPortalLayout(data);
        })
        .catch(error => {
            console.log("Empty data slot tracked: " + error.message);
            switchPortalLayout(null);
        });
}

function initializeTrackDayDropdown() {
    const dayDropdown = document.getElementById('track-day-dropdown');
    if (!dayDropdown) return;
    
    dayDropdown.innerHTML = "";
    for (let d = 1; d <= 180; d++) {
        const opt = document.createElement('option');
        opt.value = d;
        opt.innerText = "📆 Day " + d;
        dayDropdown.appendChild(opt);
    }
}

// Master boot sequence to run the entire framework on startup
window.addEventListener('DOMContentLoaded', () => {
    initializeTrackDayDropdown();
    
    document.getElementById('track-grade-selector').addEventListener('change', () => {
        applyGradeLevelLayoutTheme();
        fetchCurriculumContent();
    });
    
    document.getElementById('track-subject-selector').addEventListener('change', fetchCurriculumContent);
    document.getElementById('track-day-dropdown').addEventListener('change', fetchCurriculumContent);
    
    applyGradeLevelLayoutTheme();
    fetchCurriculumContent();
});
</script>

</body>
</html>
