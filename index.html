<div id="learning-platform-container" style="background: #f0f8ff; min-height: 100vh; font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; padding-bottom: 40px;">
    
    <header style="background: linear-gradient(135deg, #ff7675, #6c5ce7); padding: 20px; border-bottom: 6px solid #fdcbc3; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; color: white;">
        <div style="font-size: 24px; font-weight: bold; letter-spacing: 2px;">🌟 DUAL-TRACK LEARNING HUB</div>
        <div style="display: flex; gap: 15px; align-items: center;">
            <select id="track-grade-selector" onchange="switchPortalLayout()" style="padding: 10px 20px; font-size: 16px; border-radius: 30px; border: 3px solid #fff; font-weight: bold; background: #ffeaa7; cursor: pointer;">
                <option value="K-5">🖍️ Elementary Track (Grades K-5)</option>
                <option value="6-8">📘 Middle School Track (Grades 6-8)</option>
                <option value="9-12">🎓 High School Track (Grades 9-12)</option>
            </select>
            <select id="track-subject-selector" style="padding: 10px 20px; font-size: 16px; border-radius: 30px; border: 3px solid #fff; font-weight: bold; background: #fab1a0; cursor: pointer;">
                <option value="math">🔢 Math Adventures</option>
                <option value="english">🔤 Reading & Words</option>
                <option value="science">🔬 Science Secrets</option>
                <option value="social studies">🌍 World History</option>
                <option value="electives">🎨 Creative Arts</option>
            </select>
            <div style="background: #55efc4; color: #2d3436; padding: 10px 25px; font-size: 18px; font-weight: bold; border-radius: 30px; border: 3px solid #fff; box-shadow: 0 4px 0 #00b894;">
                Day <span id="current-day-display">1</span>
            </div>
        </div>
    </header>

    <main id="adaptive-portal-viewport" style="max-width: 1200px; margin: 30px auto; padding: 20px; box-sizing: border-box;">
        <!-- The interface graphics switch instantly here -->
    </main>
</div>
<style>
    .big-interactive-button {
        background: #0984e3;
        color: white;
        font-size: 22px;
        font-weight: bold;
        padding: 15px 40px;
        border: none;
        border-radius: 50px;
        box-shadow: 0 6px 0 #076bba, 0 8px 15px rgba(0,0,0,0.2);
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .big-interactive-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 0 #076bba, 0 10px 20px rgba(0,0,0,0.3);
        background: #74b9ff;
    }
    .big-interactive-button:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 #076bba;
    }
    .game-card-container {
        background: #ffffff;
        border: 5px solid #55efc4;
        border-radius: 35px;
        padding: 40px;
        box-shadow: 0 12px 25px rgba(0,0,0,0.08);
        text-align: center;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .game-card-container:hover {
        transform: scale(1.02);
    }
</style>
<script>
function switchPortalLayout() {
    const selectedGrade = document.getElementById('track-grade-selector').value;
    
    if (selectedGrade === 'K-5') {
        renderElementaryInterface();
    } else if (selectedGrade === '6-8') {
        renderMiddleSchoolInterface();
    } else if (selectedGrade === '9-12') {
        renderHighSchoolInterface();
    }
}
</script>
<script>
function renderElementaryInterface() {
    const viewport = document.getElementById('adaptive-portal-viewport');
    const subject = document.getElementById('track-subject-selector').value.toUpperCase();
    
    viewport.innerHTML = `
        <div style="display: flex; flex-direction: column; align-items: center; gap: 25px;">
            <button class="big-interactive-button" style="background: #6c5ce7; box-shadow: 0 6px 0 #4f3bb1;" onclick="console.log('Audio playback triggered')">
                🔊 Click to Hear My Lesson
            </button>
            
            <div class="game-card-container" style="width: 100%; max-width: 650px;">
                <div style="font-size: 80px; margin-bottom: 10px;">🚀</div>
                <h2 style="font-size: 32px; color: #2d3436; margin: 0 0 20px 0; letter-spacing: 1px;">
                    START MY ${subject} LEVEL ACTIVITY
                </h2>
                <button class="big-interactive-button" onclick="alert('Opening lesson playground...')">
                    Let's Play! 🌟
                </button>
            </div>
            
            <div style="background: #ffeaa7; border: 3px dashed #ffb8b8; border-radius: 20px; padding: 15px 30px; font-size: 16px; color: #636e72; font-weight: bold; text-align: center; margin-top: 20px;">
                🔒 Parent Options: Printable handwriting sheets and progress monitoring keys are located in the secure panel.
            </div>
        </div>
    `;
}
</script>
<script>
function renderMiddleSchoolInterface() {
    const viewport = document.getElementById('adaptive-portal-viewport');
    viewport.innerHTML = `
        <div style="background: white; padding: 30px; border-radius: 15px; border: 2px solid #dcdde1;">
            <h2>📚 Middle School Learning Tracker</h2>
            <p>Your daily core subject assignments are loaded sequentially below.</p>
        </div>
    `;
}

function renderHighSchoolInterface() {
    const viewport = document.getElementById('adaptive-portal-viewport');
    viewport.innerHTML = `
        <div style="background: white; padding: 30px; border-radius: 15px; border: 2px solid #b2bec3;">
            <h2>🎓 High School Academic Dashboard</h2>
            <p>Access your course overview materials, research panels, and document upload nodes.</p>
        </div>
    `;
}

// Automatically mount the dynamic layouts as soon as the webpage opens
window.addEventListener('DOMContentLoaded', () => {
    switchPortalLayout();
    document.getElementById('track-subject-selector').addEventListener('change', switchPortalLayout);
});
</script>
