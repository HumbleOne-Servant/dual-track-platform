<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual-Ledger Adaptive Platform Framework</title>
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-panel: #1e293b;
            --bg-card: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-public: #38bdf8;
            --accent-private: #fbbf24;
            --border-color: #334155;
            --accent-media: #10b981;
            --accent-teacher: #ec4899;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-primary); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

        /* Far-Left Vertical Border Grade Navigation Sidebar Grid Layout */
        .grade-sidebar {
            width: 85px;
            background: #070a12;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 0;
            overflow-y: auto;
            gap: 0.65rem;
        }

        .sidebar-brand { font-size: 0.75rem; font-weight: 800; color: var(--text-muted); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }

        .grade-btn {
            width: 52px;
            height: 52px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-muted);
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.2s ease;
        }
        .grade-btn:hover { border-color: var(--accent-public); color: var(--text-main); }
        .grade-btn.active { background: var(--accent-public); color: #000000; border-color: var(--accent-public); }

        .app-container { display: flex; flex: 1; flex-direction: column; overflow: hidden; }
        header { background: #111827; padding: 0.75rem 2rem; border-bottom: 1px solid var(--border-color); }
        h1 { font-size: 1.1rem; font-weight: 700; color: #ffffff; letter-spacing: -0.02em; }

        /* Student Selection Operations Bar Element */
        .student-controls-bar {
            background: #1e293b; padding: 0.75rem 2rem; border-bottom: 1px solid var(--border-color); display: flex; gap: 2rem; align-items: center;
        }
        .control-group { display: flex; align-items: center; gap: 0.75rem; }
        .control-group label { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

        .selector-element {
            background: var(--bg-primary); color: var(--text-main); border: 1px solid var(--border-color); padding: 0.4rem 1rem; border-radius: 6px; outline: none; font-size: 0.9rem; font-weight: 600; cursor: pointer;
        }

        main { display: flex; flex: 1; overflow: hidden; }
        .pane { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 2.5rem 2rem 2rem 2rem; position: relative; }
        .pane:first-child { border-right: 1px solid var(--border-color); }

        .public-pane { background: #131b2e; }
        .private-pane { background: #090d16; }

        .pane-badge { position: absolute; top: 1rem; left: 1rem; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; padding: 0.25rem 0.5rem; border-radius: 4px; }
        .public-badge { background: rgba(56, 189, 248, 0.1); color: var(--accent-public); }
        .private-badge { background: rgba(251, 191, 36, 0.1); color: var(--accent-private); }
        .lesson-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 0.25rem; color: #ffffff; }
        .lesson-subtitle { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.25rem; font-weight: 600; text-transform: uppercase; }
        .section-card { background: var(--bg-card); border: 1px solid var(--border-color); padding: 1.5rem; border-radius: 8px; margin-bottom: 1.25rem; }
        .section-card-header { font-size: 0.85rem; font-weight: 700; color: var(--accent-public); text-transform: uppercase; margin-bottom: 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.35rem; }
        .formatted-p { line-height: 1.8; font-size: 1.05rem; color: #e2e8f0; margin-bottom: 1rem; }
        .bullet-list-item { line-height: 1.7; font-size: 1.05rem; color: #e2e8f0; margin-left: 1.5rem; margin-bottom: 0.5rem; display: list-item; list-style-type: square; }

        /* Early Childhood Layout Elements (Grades K-2) */
        .kinder-focus-box { background: linear-gradient(135deg, #1e293b, #0f172a); border: 2px solid var(--accent-public); padding: 1.75rem; border-radius: 12px; margin-bottom: 1.5rem; text-align: center; }
        .kinder-instruction { font-size: 1.5rem; font-weight: 700; color: #ffffff; line-height: 1.5; margin-bottom: 1rem; }
        .kinder-math-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1.25rem; margin-top: 1.5rem; }
        .kinder-math-card { background: #1d2d44; border: 1px solid #38bdf8; padding: 1.25rem; border-radius: 10px; text-align: center; font-size: 1.8rem; font-weight: 800; color: #38bdf8; }

        .concept-highlight-box { background: rgba(56, 189, 248, 0.03); border-left: 4px solid var(--accent-public); padding: 1rem 1.25rem; border-radius: 0 6px 6px 0; margin-bottom: 1.25rem; font-style: italic; color: #e2e8f0; }
        
        /* Directory Asset Badges UI Grid Columns Layout */
        .resource-layout-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem; }
        .resource-sub-column { background: rgba(15, 23, 42, 0.3); border: 1px solid var(--border-color); padding: 1rem; border-radius: 6px; }
        .resource-column-title { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.25rem; }
        
        .resource-link-item { display: flex; align-items: center; gap: 0.5rem; color: #38bdf8; text-decoration: none; font-size: 0.95rem; margin-bottom: 0.4rem; font-weight: 600; }
        .resource-link-item:hover { text-decoration: underline; color: #ffffff; }

        .forensic-block { background: rgba(251, 191, 36, 0.02); border-left: 4px solid var(--accent-private); padding: 1.25rem; margin-top: 1.25rem; border-radius: 0 6px 6px 0; }
        .forensic-title { font-size: 0.85rem; font-weight: 700; color: var(--accent-private); text-transform: uppercase; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <nav class="grade-sidebar">
        <div class="sidebar-brand">Grade</div>
        <button id="btn-K" class="grade-btn active" onclick="changeGrade('K')">K</button>
        <button id="btn-1" class="grade-btn" onclick="changeGrade('1')">1</button>
        <button id="btn-2" class="grade-btn" onclick="changeGrade('2')">2</button>
        <button id="btn-3" class="grade-btn" onclick="changeGrade('3')">3</button>
        <button id="btn-4" class="grade-btn" onclick="changeGrade('4')">4</button>
        <button id="btn-5" class="grade-btn" onclick="changeGrade('5')">5</button>
        <button id="btn-6" class="grade-btn" onclick="changeGrade('6')">6</button>
        <button id="btn-7" class="grade-btn" onclick="changeGrade('7')">7</button>
        <button id="btn-8" class="grade-btn" onclick="changeGrade('8')">8</button>
        <button id="btn-9" class="grade-btn" onclick="changeGrade('9')">9</button>
        <button id="btn-10" class="grade-btn" onclick="changeGrade('10')">10</button>
        <button id="btn-11" class="grade-btn" onclick="changeGrade('11')">11</button>
        <button id="btn-12" class="grade-btn" onclick="changeGrade('12')">12</button>
    </nav>

    <div class="app-container">
        <header>
            <h1>Dual-Ledger Adaptive Platform Framework</h1>
        </header>

        <div class="student-controls-bar">
            <div class="control-group">
                <label for="subjectSelect">Track Subject:</label>
                <select id="subjectSelect" class="selector-element" onchange="changeSubject()">
                    <option value="Mathematics" selected>Mathematics</option>
                    <option value="Science">Science</option>
                    <option value="English Language Arts">English Language Arts</option>
                </select>
            </div>
            <div class="control-group">
                <label for="daySelect">Lesson Matrix Day:</label>
                <select id="daySelect" class="selector-element" onchange="changeDay()">
                </select>
            </div>
        </div>

        <main>
            <section class="pane public-pane">
                <span class="pane-badge public-badge">Public Learning Node</span>
                <div id="publicContent">Loading instructional resources...</div>
            </section>
            <section class="pane private-pane">
                <span class="pane-badge private-badge">Private Forensic Ledger</span>
                <div id="privateContent">Loading parallel overlays...</div>
            </section>
        </main>
    </div>
    <script>
        let currentGrade = 'K';
        let currentSubject = 'Mathematics';
        let currentDay = 1;
        let databaseCache = [];

        function generateDayDropdown() {
            const daySelect = document.getElementById('daySelect');
            daySelect.innerHTML = '';
            for (let i = 1; i <= 180; i++) { daySelect.innerHTML += `<option value="${i}">Day ${i}</option>`; }
            daySelect.value = currentDay;
        }

        function changeGrade(grade) {
            currentGrade = grade;
            document.querySelectorAll('.grade-btn').forEach(btn => {
                if (btn.id === `btn-${grade}`) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            fetchPayload();
        }

        function changeSubject() { currentSubject = document.getElementById('subjectSelect').value; renderView(); }
        function changeDay() { currentDay = parseInt(document.getElementById('daySelect').value) || 1; renderView(); }

        async function fetchPayload() {
            try {
                const response = await fetch(`https://onrender.com{currentGrade}`);
                databaseCache = await response.json();
                renderView();
            } catch (error) {
                document.getElementById('publicContent').innerHTML = `<p style="color:#ef4444">Server disconnected.</p>`;
            }
        }
        function formatBodyProse(text, grade) {
            if (!text) return `<p class="formatted-p" style="color:var(--text-muted)">No lesson text content active.</p>`;
            if (grade === 'K' || grade === '1' || grade === '2') {
                if (text.includes('+') && text.includes('=')) {
                    const formulas = text.match(/\d+\s*\+\s*\d+\s*=\s*[\d_]*/g) || [];
                    let html = `<div class="kinder-focus-box"><div class="kinder-instruction">🌟 Let's Count Together! 🌟</div><div class="kinder-math-grid">`;
                    formulas.forEach(f => { html += `<div class="kinder-math-card">${f}</div>`; });
                    return html + `</div></div>`;
                }
                const sentences = text.split(/[.!?]/).map(s => s.trim()).filter(s => s.length > 10);
                return `<div class="kinder-focus-box"><div class="kinder-instruction">👋 Daily Activity Action:</div><p class="formatted-p" style="font-size:1.3rem; text-align:center; color:#38bdf8; font-weight:700;">${sentences || text}.</p></div>`;
            }
            return text.split('\n\n').map((p, i) => i === 0 && p.length < 180 ? `<div class="concept-highlight-box">⚡ Core Principle: ${p}</div>` : `<p class="formatted-p">${p}</p>`).join('');
        }

        function renderView() {
            const publicContainer = document.getElementById('publicContent');
            const privateContainer = document.getElementById('privateContent');

            const trackingRows = databaseCache.filter(r => r.subject?.trim().toLowerCase() === currentSubject.toLowerCase());
            if (trackingRows.length === 0) {
                publicContainer.innerHTML = `<h2 class="lesson-title">${currentSubject} — Day ${currentDay}</h2><div class="section-card"><p style="color:var(--text-muted)">No rows logged matching selection coordinates.</p></div>`;
                return;
            }

            const activeIndex = (currentDay - 1) % trackingRows.length;
            const record = trackingRows[activeIndex];

            let assetHTML = '';
            if (record.student_worksheets?.length || record.powerpoints?.length || record.internet_links?.length || record.teacher_guides?.length) {
                assetHTML = `<div class="resource-layout-grid">`;
                
                assetHTML += `<div class="resource-sub-column"><div class="resource-column-title" style="color:var(--accent-public)">✏️ Student Activity & Media</div>`;
                if (record.student_worksheets) record.student_worksheets.forEach(w => { assetHTML += `<a href="http://localhost:8080${w.url}" class="resource-link-item" download>📄 Worksheet: ${w.title}</a>`; });
                if (record.powerpoints) record.powerpoints.forEach(p => { assetHTML += `<a href="http://localhost:8080${p.url}" class="resource-link-item" download style="color:var(--accent-media)">🖥️ Presentation: ${p.title}</a>`; });
                if (record.internet_links) record.internet_links.forEach(l => { assetHTML += `<a href="${l.url}" target="_blank" class="resource-link-item" style="color:#fbbf24">🌐 Open Web Resource: ${l.title}</a>`; });
                assetHTML += `</div>`;
                
                assetHTML += `<div class="resource-sub-column"><div class="resource-column-title" style="color:var(--accent-teacher)">🔑 Teacher Instructions & Keys</div>`;
                if (record.teacher_guides) record.teacher_guides.forEach(t => { assetHTML += `<a href="http://localhost:8080${t.url}" class="resource-link-item" download style="color:var(--accent-teacher)">🛡️ Guide File: ${t.title}</a>`; });
                if (!record.teacher_guides?.length) assetHTML += `<p style="font-size:0.85rem; color:var(--text-muted);">No separate teacher keys assigned.</p>`;
                assetHTML += `</div></div>`;
            }

            publicContainer.innerHTML = `
                <h2 class="lesson-title">${record.title || `\${currentSubject} Study Node`}</h2>
                <div class="lesson-subtitle">Grade Track: ${currentGrade} | Subject Node: ${currentSubject} | Day: ${currentDay} of 180</div>
                ${assetHTML}
                <div class="section-card">
                    <div class="section-card-header">Lesson Presentation Material</div>
                    ${formatBodyProse(record.mainstream_body, currentGrade)}
                </div>
            `;

            privateContainer.innerHTML = `
                <h2 class="lesson-title" style="color:var(--accent-private)">Forensic Overlays</h2>
                <div class="lesson-subtitle">Sync Hash: ID-${record.day || 'N/A'}</div>
                <div class="forensic-block">
                    <div class="forensic-header">Scriptural Cross Reference / Context</div>
                    <p class="formatted-p" style="line-height:1.75;">${record.biblical_body || 'No parallel scriptural forensics logged.'}</p>
                </div>
            `;
        }

        window.onload = () => { generateDayDropdown(); changeGrade('K'); };
    </script>
</body>
</html>
