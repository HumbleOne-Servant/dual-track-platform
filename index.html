<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Immersion Dual-Track Portal</title>
    <style>
        body { margin: 0; padding: 0; transition: background-color 0.4s ease; font-family: system-ui, -apple-system, sans-serif; }
        .main-container { min-height: 100vh; padding-bottom: 50px; }
        header { padding: 20px; display: flex; justify-content: space-between; align-items: center; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: background 0.4s ease; }
        .control-select { padding: 10px 20px; font-size: 15px; border-radius: 30px; font-weight: bold; border: 2px solid white; cursor: pointer; }
        
        /* 🖍️ DYNAMIC THEME ANIMATIONS & CLASSROOM CONTAINER OVERRIDES */
        .immersive-viewport-wrapper { max-width: 950px; margin: 0 auto; width: 100%; transition: all 0.4s ease; }
        
        /* Playful Kinder Interactive Items */
        .kinder-dot { width: 50px; height: 50px; background: #2d3436; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px; cursor: pointer; transition: transform 0.2s, background 0.2s; box-shadow: 0 4px 8px rgba(0,0,0,0.15); }
        .kinder-dot.active { background: #e84393; transform: scale(1.15); box-shadow: 0 6px 12px rgba(232, 67, 147, 0.4); }
        
        .number-line-block { background: #ffeaa7; border: 3px solid #fdcb6e; border-radius: 15px; padding: 20px; display: inline-block; font-size: 24px; font-weight: bold; color: #d63031; cursor: pointer; transition: all 0.2s; min-width: 60px; text-align: center; box-shadow: 0 6px 0 #xbf963f; }
        .number-line-block:active { transform: translateY(4px); box-shadow: 0 2px 0 #xbf963f; }

        .sorting-badge { background: #ffffff; border: 2px solid #b2bec3; padding: 12px 20px; border-radius: 30px; font-weight: bold; font-size: 16px; cursor: grab; display: inline-block; margin: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s; }
        .sorting-badge:hover { transform: scale(1.05); }

        /* Universal Layout Card Mixins */
        .lesson-sheet-paper { background: #ffffff; border-radius: 30px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; }
        .audio-trigger-btn { background: linear-gradient(to bottom, #6c5ce7, #4f3bb1); color: white; border: none; padding: 16px 35px; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 6px 0 #3b2b8c; transition: all 0.1s ease; display: block; margin: 0 auto 25px auto; }
        .audio-trigger-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #3b2b8c; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
<div id="learning-platform-container" class="main-container" style="background: #f0f8ff;">
    
    <!-- Unified Student Dashboard Controls -->
    <header id="dynamic-header-bar" style="background: linear-gradient(135deg, #ff7675, #6c5ce7);">
        <div style="font-size: 22px; font-weight: bold; letter-spacing: 1px;">🏫 LIVE PRODUCTION WORKSTATION</div>
        <div style="display: flex; gap: 15px; align-items: center;">
            
            <select id="grade-selector" class="control-select" style="background: #ffeaa7;" onchange="executeDynamicPortalUpdate()">
                <optgroup label="🖍️ Kindergarten Tracks">
                    <option value="gk">Kindergarten Base</option>
                </optgroup>
                <optgroup label="📘 Academy Division">
                    <option value="g1">Grade 1 Core</option>
                    <option value="g7">Grade 7 Lecture</option>
                </optgroup>
            </select>
            
            <select id="subject-selector" class="control-select" style="background: #fab1a0;" onchange="executeDynamicPortalUpdate()">
                <option value="mathematics">🔢 Mathematics Track</option>
                <option value="science">🔬 Scientific Investigations</option>
            </select>
            
            <select id="day-selector" class="control-select" style="background: #55efc4; color: #2d3436;" onchange="executeDynamicPortalUpdate()">
                <option value="1">📆 Day 1 Track</option>
                <option value="2">📆 Day 2 Track</option>
            </select>
            
        </div>
    </header>

    <!-- Visual Interactive Immersion Arena -->
    <main style="padding: 40px 20px;">
        <div id="adaptive-portal-viewport" class="immersive-viewport-wrapper">
            <!-- Customized themed learning sandboxes load dynamically here -->
        </div>
    </main>
</div>
<script>
// Configuration matrix to adapt container themes automatically
const DISPATCH_THEMES = {
    "math_day1": { bg: "#fff5f5", cardBorder: "#ff7675" },
    "math_day2": { bg: "#fffdf0", cardBorder: "#fbc531" },
    "science_day1": { bg: "#ebfbee", cardBorder: "#2ecc71" },
    "science_day2": { bg: "#f3f0ff", cardBorder: "#9c88ff" }
};

function executeDynamicPortalUpdate() {
    const grade = document.getElementById('grade-selector').value;
    const subject = document.getElementById('subject-selector').value;
    const day = document.getElementById('day-selector').value;
    
    // Set standard asset path mapping to your local 46,800 file catalog vault
    const unitFolder = subject === "mathematics" ? "unit_1_foundations" : "unit_1_foundations";
    const targetFileUrl = `/pure_curriculum_vault/k5/${grade}/${subject}/${unitFolder}/day_${day}.json`;
    
    console.log("Fetching visual data module from: " + targetFileUrl);

    fetch(targetFileUrl)
        .then(response => {
            if (!response.ok) { throw new Error("Awaiting database content payload."); }
            return response.json();
        })
        .then(data => {
            compileThemeDrivenClassroom(grade, subject, parseInt(day), data);
        })
        .catch(error => {
            document.getElementById('adaptive-portal-viewport').innerHTML = `
                <div style="text-align: center; color: #a4b0be; padding: 6px 0;">
                    <h2>📖 Awaiting AI Curriculum Generation</h2>
                    <p>Launch your local <code>curricullm_engine.py</code> script to build files inside: <code>${targetFileUrl}</code></p>
                </div>`;
        });
}
</script>
<script>
function compileThemeDrivenClassroom(grade, subject, day, data) {
    const viewport = document.getElementById('adaptive-portal-viewport');
    const container = document.getElementById('learning-platform-container');
    
    // ------------------------------------------------------------------
    // VISUAL SANDBOX CONFIGURATION: MATHEMATICS
    // ------------------------------------------------------------------
    if (subject === "mathematics" && grade === "gk") {
        if (day === 1) {
            // Theme 1: Ten Black Dots & Circle Canvas Room
            container.style.backgroundColor = DISPATCH_THEMES.math_day1.bg;
            viewport.innerHTML = `
                <div style="animation: fadeIn 0.3s ease;">
                    <button class="audio-trigger-btn" onclick="triggerVoiceReader('${data.lesson_body.replace(/'/g, "\\'")}')">🔊 Read Lesson Aloud</button>
                    
                    <div class="lesson-sheet-paper" style="border-top: 10px solid ${DISPATCH_THEMES.math_day1.cardBorder}; text-align:center; margin-bottom: 30px;">
                        <h1 style="color: #2d3436; margin-top:0;">🔴 ${data.lesson_title}</h1>
                        <p style="text-align: left; font-size: 18px; line-height: 1.6; color: #2d3436; background: #fffdf8; padding: 25px; border-radius: 16px; border: 1px solid #ffeaa7;">${data.lesson_body}</p>
                        
                        <!-- INTERACTIVE DOT BOARD WIDGET: Directly matches the Book Text -->
                        <h3 style="color: #e84393; margin-top: 30px;">🔢 Tap the Interactive Counting Dots!</h3>
                        <p style="color: #636e72; font-size: 15px;">Tap each dot below one-by-one to practice counting out loud from 1 to 10.</p>
                        <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; padding: 20px 0;">
                            ${Array.from({length: 10}, (_, i) => `<div class="kinder-dot" onclick="this.classList.toggle('active'); playClickAudio(\({i+1});">\){i+1}</div>`).join('')}
                        </div>
                    </div>

                    <!-- Immersive Hands-on Project Slate -->
                    <div class="lesson-sheet-paper" style="border-top: 10px solid #74b9ff; background: #f1f7ff;">
                        <h3 style="color: #0984e3; margin-top:0;">🎨 Creative Assignment Workspace</h3>
                        <p style="color: #2d3436; font-size: 16px; line-height: 1.5;">${data.interactive_assignment}</p>
                        <div style="background: white; border: 3px dashed #74b9ff; border-radius: 20px; height: 160px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #b2bec3; cursor: crosshair;" onclick="alert('Drawing tool activated!')">
                            🔴 [Click here to unlock the Dot Art Response Canvas]
                        </div>
                    </div>
                </div>`;
        } else if (day === 2) {
            // Theme 2: Interactive Tactile Number Line & Blocks Room
            container.style.backgroundColor = DISPATCH_THEMES.math_day2.bg;
            viewport.innerHTML = `
                <div style="animation: fadeIn 0.3s ease;">
                    <button class="audio-trigger-btn" onclick="triggerVoiceReader('${data.lesson_body.replace(/'/g, "\\'")}')">🔊 Read Lesson Aloud</button>
                    
                    <div class="lesson-sheet-paper" style="border-top: 10px solid ${DISPATCH_THEMES.math_day2.cardBorder}; text-align:center; margin-bottom: 30px;">
                        <h1 style="color: #2d3436; margin-top:0;">🪵 ${data.lesson_title}</h1>
                        <p style="text-align: left; font-size: 18px; line-height: 1.6; color: #2d3436; background: #faf9f0; padding: 25px; border-radius: 16px; border: 1px solid #fdcb6e;">${data.lesson_body}</p>
                        
                        <!-- INTERACTIVE WOODEN NUMBER LINE WIDGET -->
                        <h3 style="color: #d63031; margin-top: 30px;">🧗 Step Along the Wooden Number Line!</h3>
                        <p style="color: #636e72; font-size: 15px;">Tap the blocks in order from 1 to 5 to show how numbers grow larger.</p>
                        <div style="display: flex; gap: 20px; justify-content: center; padding: 25px 0;">
                            ${Array.from({length: 5}, (_, i) => `<div class="number-line-block" onclick="alert('Step matched on block number ' + \({(i+1)} + '!')">\){i+1}</div>`).join('')}
                        </div>
                    </div>

                    <div class="lesson-sheet-paper" style="border-top: 10px solid #fdcb6e; background: #fffdf0;">
                        <h3 style="color: #e67e22; margin-top:0;">✂️ Interactive Collage Assignment</h3>
                        <p style="color: #2d3436; font-size: 16px; line-height: 1.5;">${data.interactive_assignment}</p>
                        <div style="background: white; border: 3px dashed #fdcb6e; border-radius: 20px; height: 150px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #d1ccc0;" onclick="alert('Collage tool loaded.')">
                            🔢 [Click to Drag Number Cards Into the Collage Box]
                        </div>
                    </div>
                </div>`;
        }
    } else {
        compileScienceThemedClassroom(grade, subject, day, data, viewport, container);
    }
}
</script>
<script>
function compileScienceThemedClassroom(grade, subject, day, data, viewport, container) {
    // ------------------------------------------------------------------
    // VISUAL SANDBOX CONFIGURATION: SCIENCE
    // ------------------------------------------------------------------
    if (subject === "science" && grade === "gk") {
        if (day === 1) {
            // Theme 3: Matter States Interactive Room
            container.style.backgroundColor = DISPATCH_THEMES.science_day1.bg;
            viewport.innerHTML = `
                <div style="animation: fadeIn 0.3s ease;">
                    <button class="audio-trigger-btn" onclick="triggerVoiceReader('${data.lesson_body.replace(/'/g, "\\'")}')">🔊 Read Lesson Aloud</button>
                    
                    <div class="lesson-sheet-paper" style="border-top: 10px solid ${DISPATCH_THEMES.science_day1.cardBorder}; text-align:center; margin-bottom: 30px;">
                        <h1 style="color: #2d3436; margin-top:0;">🧱 ${data.lesson_title}</h1>
                        <p style="text-align: left; font-size: 18px; line-height: 1.6; color: #2d3436; background: #f4fff7; padding: 25px; border-radius: 16px; border: 1px solid #a8e6cf;">${data.lesson_body}</p>
                        
                        <!-- INTERACTIVE MATTER STATE CHANGER WIDGET -->
                        <h3 style="color: #27ae60; margin-top: 30px;">🧪 Tap the Matter Test Jars!</h3>
                        <div style="display: flex; gap: 25px; justify-content: center; padding: 20px 0;">
                            <div style="background: #dfe6e9; border: 3px solid #b2bec3; padding: 20px; border-radius: 12px; cursor: pointer; font-weight:bold;" onclick="alert('Solid Test: Hard like a toy brick!')">🧱 Solid Jar</div>
                            <div style="background: #74b9ff; border: 3px solid #0984e3; padding: 20px; border-radius: 12px; cursor: pointer; font-weight:bold; color:white;" onclick="alert('Liquid Test: Flows like water drops!')">💧 Liquid Jar</div>
                            <div style="background: #e17055; border: 3px solid #d63031; padding: 20px; border-radius: 12px; cursor: pointer; font-weight:bold; color:white;" onclick="alert('Gas Test: Fills the jar like a balloon!')">🎈 Gas Jar</div>
                        </div>
                    </div>

                    <div class="lesson-sheet-paper" style="border-top: 10px solid #2ecc71; background: #ebfbeee;">
                        <h3 style="color: #27ae60; margin-top:0;">🔍 Matter Detective Lab</h3>
                        <p style="color: #2d3436; font-size: 16px;">${data.interactive_assignment}</p>
                        <button class="audio-trigger-btn" style="background:#2ecc71; box-shadow:0 6px 0 #1e7e43;" onclick="alert('Camera system initialized to take photos of items!')">📸 Capture Item Properties</button>
                    </div>
                </div>`;
        } else if (day === 2) {
            // Theme 4: Living vs Non-Living Sorting Board Room
            container.style.backgroundColor = DISPATCH_THEMES.science_day2.bg;
            viewport.innerHTML = `
                <div style="animation: fadeIn 0.3s ease;">
                    <button class="audio-trigger-btn" onclick="triggerVoiceReader('${data.lesson_body.replace(/'/g, "\\'")}')">🔊 Read Lesson Aloud</button>
                    
                    <div class="lesson-sheet-paper" style="border-top: 10px solid ${DISPATCH_THEMES.science_day2.cardBorder}; text-align:center; margin-bottom: 30px;">
                        <h1 style="color: #2d3436; margin-top:0;">🐜 ${data.lesson_title}</h1>
                        <p style="text-align: left; font-size: 18px; line-height: 1.6; color: #2d3436; background: #fdfcff; padding: 25px; border-radius: 16px; border: 1px solid #dcd6f7;">${data.lesson_body}</p>
                        
                        <!-- INTERACTIVE LIVING COHORT CLASSIFICATION DRAG DOCK -->
                        <h3 style="color: #8c7ae6; margin-top: 30px;">🗂️ Tactile Nature Classification Board</h3>
                        <p style="color: #718093; font-size: 15px;">Tap an item token below to classify its lifecyle status instantly.</p>
                        
                        <div style="background: #f8f9fa; border: 2px dashed #b2bec3; padding: 15px; border-radius: 15px; margin-bottom: 25px;">
                            <div class="sorting-badge" onclick="alert('Classification Correct! Ants grow, breathe, and move.')">🐜 Busy Ant</div>
                            <div class="sorting-badge" onclick="alert('Classification Correct! Trees use sunlight to grow big.')">🌳 Green Tree</div>
                            <div class="sorting-badge" onclick="alert('Classification Correct! Cars are built out of metal, they are non-living.')">🚗 Toy Car</div>
                            <div class="sorting-badge" onclick="alert('Classification Correct! Clouds are made of water vapor in the sky.')">☁️ Sky Cloud</div>
                        </div>
                    </div>

                    <div class="lesson-sheet-paper" style="border-top: 10px solid #9c88ff; background: #f5f4ff;">
                        <h3 style="color: #6c5ce7; margin-top:0;">🎒 Nature Scavenger Hunt Console</h3>
                        <p style="color: #2d3436; font-size: 16px; line-height: 1.5;">${data.interactive_assignment}</p>
                        <div style="display:flex; gap:20px; justify-content:center;">
                            <button class="audio-trigger-btn" style="background:#6c5ce7; box-shadow:0 6px 0 #4a3b9c; margin:0;" onclick="alert('Living log checklist recorded.')">📝 Log Living Thing</button>
                            <button class="audio-trigger-btn" style="background:#718093; box-shadow:0 6px 0 #4b5463; margin:0;" onclick="alert('Non-living log checklist recorded.')">📝 Log Non-Living Thing</button>
                        </div>
                    </div>
                </div>`;
        }
    }
}
</script>
<script>
function playClickAudio(number) {
    // Play structural sound triggers matching early childhood sensory requirements
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(number.toString());
        utterance.rate = 1.1;
        window.speechSynthesis.speak(utterance);
    }
}

function triggerVoiceReader(textToRead) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(textToRead);
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
    }
}

// Master bootstrap routine to lock in navigation tracking triggers on page mount
window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('grade-selector').addEventListener('change', executeDynamicPortalUpdate);
    document.getElementById('subject-selector').addEventListener('change', executeDynamicPortalUpdate);
    document.getElementById('day-selector').addEventListener('change', executeDynamicPortalUpdate);
    
    // Auto clear space and paint configurations instantly on load
    executeDynamicPortalUpdate();
});
</script>
</body>
</html>
