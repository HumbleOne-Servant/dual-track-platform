<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Immersion Thematic Classroom Portal</title>
    <style>
        body { margin: 0; padding: 0; transition: background-color 0.4s ease; font-family: system-ui, -apple-system, sans-serif; background-color: #f7f9fc; }
        .main-container { min-height: 100vh; padding-bottom: 50px; }
        header { padding: 18px 25px; display: flex; justify-content: space-between; align-items: center; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.08); transition: background 0.4s ease; }
        .control-select { padding: 10px 20px; font-size: 15px; border-radius: 30px; font-weight: bold; border: 2px solid white; cursor: pointer; outline: none; }
        
        /* 🎨 MASTER CLASSROOM IMPRESSION CARDS */
        .immersive-viewport-wrapper { max-width: 1000px; margin: 0 auto; width: 100%; animation: slideUp 0.3s ease-out; }
        .worksheet-paper-container { background: #ffffff; border-radius: 24px; padding: 35px; box-shadow: 0 8px 32px rgba(0,0,0,0.04); border: 1px solid #e2e8f0; position: relative; overflow: hidden; margin-bottom: 30px; }
        
        /* Interactive Thematic SVG Vector Styling */
        .color-region { cursor: pointer; transition: fill 0.2s ease, stroke-width 0.2s; stroke: #4a5568; stroke-width: 1.5; }
        .color-region:hover { stroke-width: 3; filter: brightness(0.95); }
        
        /* Stylized Color Guide Palette Elements */
        .palette-swatch { width: 45px; height: 45px; border-radius: 50%; border: 3px solid #ffffff; box-shadow: 0 4px 8px rgba(0,0,0,0.15); cursor: pointer; transition: transform 0.2s; position: relative; }
        .palette-swatch:hover { transform: scale(1.15); }
        .palette-swatch.selected::after { content: "✓"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-weight: bold; font-size: 18px; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        
        .audio-banner-btn { background: linear-gradient(135deg, #6c5ce7, #574b90); color: white; border: none; padding: 14px 28px; border-radius: 50px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3); transition: all 0.2s; display: block; margin: 0 auto 25px auto; }
        .audio-banner-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(108, 92, 231, 0.4); }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
<div id="learning-platform-container" class="main-container">
    
    <!-- Top Configuration Dashboard Panel -->
    <header id="dynamic-header-bar" style="background: linear-gradient(135deg, #ff7675, #6c5ce7);">
        <div style="font-size: 20px; font-weight: bold; letter-spacing: 0.5px; display: flex; align-items: center; gap: 10px;">☀️ DUAL-TRACK INTERACTIVE WORKSTATION</div>
        <div style="display: flex; gap: 15px; align-items: center;">
            
            <select id="grade-selector" class="control-select" style="background: #ffeaa7;" onchange="executeDynamicPortalUpdate()">
                <optgroup label="🖍️ Elementary Tracks">
                    <option value="gk">Kindergarten Base</option>
                </optgroup>
            </select>
            
            <select id="subject-selector" class="control-select" style="background: #fab1a0;" onchange="executeDynamicPortalUpdate()">
                <option value="mathematics">🔢 Mathematics Track</option>
                <option value="science">🔬 Scientific Investigations</option>
            </select>
            
            <select id="day-selector" class="control-select" style="background: #55efc4; color: #2d3436;" onchange="executeDynamicPortalUpdate()">
                <option value="1">📆 Day 1 Track</option>
                <option value="2">📆 Day 2 Track</option>
            </select>
            
        </div>
    </header>

    <!-- Main Dynamic Interface Viewport -->
    <main style="padding: 30px 20px;">
        <div id="adaptive-portal-viewport" class="immersive-viewport-wrapper">
            <!-- Custom illustrated vector worksheets populate here live -->
        </div>
    </main>
</div>
<script>
let currentSelectedColor = "#2ecc71"; // Default background color token for active palette fills

const VIEWPORT_BACKGROUNDS = {
    "mathematics": "#fffcf4",
    "science": "#f4fcf7"
};

function executeDynamicPortalUpdate() {
    const grade = document.getElementById('grade-selector').value;
    const subject = document.getElementById('subject-selector').value;
    const day = document.getElementById('day-selector').value;
    
    document.getElementById('learning-platform-container').style.backgroundColor = DISPATCH_THEMES[subject] || DISPATCH_THEMES.mathematics;
    
    // Core database routing to your local 46,800 layout folder node catalog vault
    const unitFolder = "unit_1_foundations";
    const targetFileUrl = `/pure_curriculum_vault/k5/${grade}/${subject}/${unitFolder}/day_${day}.json`;
    
    console.log("Ingesting raw lesson data map from: " + targetFileUrl);

    fetch(targetFileUrl)
        .then(response => {
            if (!response.ok) { throw new Error("Target file asset missing inside local vaults."); }
            return response.json();
        })
        .then(data => {
            generateImmersiveThematicWorksheet(subject, parseInt(day), data);
        })
        .catch(error => {
            document.getElementById('adaptive-portal-viewport').innerHTML = `
                <div style="text-align: center; color: #94a3b8; padding: 40px 0;">
                    <h2>📖 Active System Content Gateway Standing By</h2>
                    <p>Launch your local <code>curricullm_engine.py</code> script to map out data strings inside: <code>${targetFileUrl}</code></p>
                </div>`;
        });
}

function updateActivePaletteColor(element, colorHex) {
    currentSelectedColor = colorHex;
    document.querySelectorAll('.palette-swatch').forEach(swatch => swatch.classList.remove('selected'));
    element.classList.add('selected');
}

function fillVectorRegion(regionElement) {
    regionElement.style.fill = currentSelectedColor;
}
</script>
<script>
function generateImmersiveThematicWorksheet(subject, day, data) {
    const viewport = document.getElementById('adaptive-portal-viewport');
    
    if (subject === "mathematics") {
        if (day === 1) {
            // THEMATIC WORKSHEET: Color-By-Number Counting Pond Matrix
            viewport.innerHTML = `
                <div style="animation: slideUp 0.3s ease-out;">
                    <button class="audio-banner-btn" onclick="triggerVoiceSynthesis('${data.lesson_body.replace(/'/g, "\\'")}')">🔊 Read Lesson Body Out Loud</button>
                    
                    <div class="worksheet-paper-container" style="border-top: 8px solid #ff7675;">
                        <h2 style="margin-top:0; color: #1e293b; font-size: 24px; text-align:center;">🦆 ${data.lesson_title}: Duck Pond Color-By-Number</h2>
                        <p style="font-size: 16px; line-height: 1.6; color: #4a5568; margin-bottom: 25px;">${data.lesson_body}</p>
                        
                        <!-- PALETTE COLOR SELECTOR GUIDE -->
                        <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 15px; display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 25px;">
                            <strong style="color: #4a5568; font-size: 15px;">🎨 Color Guide:</strong>
                            <div class="palette-swatch selected" style="background: #2ecc71;" onclick="updateActivePaletteColor(this, '#2ecc71')"><span style="position:absolute; bottom:-22px; left:50%; transform:translateX(-50%); font-size:11px; color:#4a5568; font-weight:bold;">1:Green</span></div>
                            <div class="palette-swatch" style="background: #f1c40f;" onclick="updateActivePaletteColor(this, '#f1c40f')"><span style="position:absolute; bottom:-22px; left:50%; transform:translateX(-50%); font-size:11px; color:#4a5568; font-weight:bold;">2:Yellow</span></div>
                            <div class="palette-swatch" style="background: #3498db;" onclick="updateActivePaletteColor(this, '#3498db')"><span style="position:absolute; bottom:-22px; left:50%; transform:translateX(-50%); font-size:11px; color:#4a5568; font-weight:bold;">3:Blue</span></div>
                        </div>

                        <!-- LITTERAL ILLUSTRATED WORKBOOK DRAWING LAYER -->
                        <div style="text-align: center; background: #fafbfc; border-radius: 16px; padding: 20px; border: 1px solid #e2e8f0;">
                            <svg viewBox="0 0 400 200" style="width: 100%; max-width: 500px; height: auto; margin: 0 auto; display: block;">
                                <!-- Sky background region (Code 3) -->
                                <rect x="0" y="0" width="400" height="120" fill="#e0f2fe" class="color-region" onclick="fillVectorRegion(this)"/>
                                <text x="180" y="40" fill="#64748b" font-weight="bold" font-size="12">3</style>
                                
                                <!-- Pond Water region (Code 3) -->
                                <ellipse cx="200" cy="160" rx="180" ry="35" fill="#bae6fd" class="color-region" onclick="fillVectorRegion(this)"/>
                                <text x="200" y="170" fill="#0369a1" font-weight="bold" font-size="12">3</text>
                                
                                <!-- Duck Body 1 (Code 2) -->
                                <path d="M 120 140 Q 140 110 170 140 Q 150 160 120 140" fill="#fef08a" class="color-region" onclick="fillVectorRegion(this)"/>
                                <circle cx="160" cy="130" r="12" fill="#fef08a" class="color-region" onclick="fillVectorRegion(this)"/>
                                <circle cx="164" cy="128" r="2" fill="#000"/>
                                <polygon points="172,128 180,132 172,134" fill="#f97316"/>
                                <text x="140" y="142" fill="#a16207" font-weight="bold" font-size="10">2</text>
                                
                                <!-- Reeds and Grass (Code 1) -->
                                <path d="M 20 150 L 30 110 L 40 150 M 35 150 L 48 100 L 55 150" fill="none" stroke="#86efac" stroke-width="4" class="color-region" onclick="this.style.stroke=currentSelectedColor"/>
                                <text x="32" y="140" fill="#166534" font-weight="bold" font-size="10">1</text>
                            </svg>
                        </div>
                    </div>

                    <!-- Dynamic Visual Interactive Assignment Box -->
                    <div class="worksheet-paper-container" style="border-top: 8px solid #3498db; background: #f8fafc;">
                        <h3 style="color: #1e3a8a; margin-top:0;">📝 Lesson Practical Sandbox Activity</h3>
                        <p style="color: #334155; font-size: 15px; line-height: 1.5;">${data.interactive_assignment}</p>
                        <div style="background: white; border: 2px dashed #cbd5e1; border-radius: 16px; padding: 25px; text-align: center;">
                            <button class="audio-banner-btn" style="background:#3b82f6; box-shadow: 0 4px 0 #1d4ed8; margin:0 auto;" onclick="alert('Digital tracing overlays active! Touch elements to verify boundaries.')">✨ Activate Interactive Tracing Overlay</button>
                        </div>
                    </div>
                </div>`;
        } else if (day === 2) {
            // Theme: Target Counting Block Matrix
            viewport.innerHTML = `
                <div style="animation: slideUp 0.3s ease-out;">
                    <button class="audio-banner-btn" onclick="triggerVoiceSynthesis('${data.lesson_body.replace(/'/g, "\\'")}')">🔊 Read Lesson Body Out Loud</button>
                    
                    <div class="worksheet-paper-container" style="border-top: 8px solid #fbc531;">
                        <h2 style="margin-top:0; color: #1e293b; font-size: 24px; text-align:center;">🍎 ${data.lesson_title}: Interactive Target Counter</h2>
                        <p style="font-size: 16px; line-height: 1.6; color: #4a5568; margin-bottom: 25px;">${data.lesson_body}</p>
                        
                        <!-- VISUAL OBJECT COUNTING BOX MATRIX -->
                        <h4 style="color: #d35400; text-align:center;">Touch each target apple icon below to verify the complete dataset total:</h4>
                        <div style="display: flex; gap: 20px; justify-content: center; padding: 20px 0;">
                            ${Array.from({length: 5}, (_, i) => `
                                <div style="background: #fff5f5; border: 3px solid #ff7675; border-radius: 50%; width: 65px; height: 65px; display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.1s;" onclick="this.style.background='#ffcb74'; window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance('\${i+1}'); window.speechSynthesis.speak(u);">🍎</div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="worksheet-paper-container" style="border-top: 8px solid #e67e22; background: #fffdf7;">
                        <h3 style="color: #d35400; margin-top:0;">📝 Thematic Activity Space</h3>
                        <p style="color: #4a5568; font-size: 15px;">${data.interactive_assignment}</p>
                        <div style="background: white; border: 2px dashed #f39c12; border-radius: 16px; height: 120px; display: flex; align-items: center; justify-content: center; color: #bdc3c7; font-weight: bold; cursor: pointer;" onclick="alert('Sticker collection window overlay initialized.')">
                            ✨ [Click to Drag Thematic Stickers Onto the Collection Board Container]
                        </div>
                    </div>
                </div>`;
        }
    } else {
        generateImmersiveScienceWorksheet(day, data, viewport);
    }
}
</script>
<script>
function generateImmersiveScienceWorksheet(day, data, viewport) {
    if (day === 1) {
        // Theme: Matter State Jar Tester
        viewport.innerHTML = `
            <div style="animation: slideUp 0.3s ease-out;">
                <button class="audio-banner-btn" onclick="triggerVoiceSynthesis('${data.lesson_body.replace(/'/g, "\\'")}')">🔊 Read Lesson Body Out Loud</button>
                
                <div class="worksheet-paper-container" style="border-top: 8px solid #2ecc71;">
                    <h2 style="margin-top:0; color: #1e293b; font-size: 24px; text-align:center;">🔬 ${data.lesson_title}: Matter Laboratory Jars</h2>
                    <p style="font-size: 16px; line-height: 1.6; color: #4a5568; margin-bottom: 25px;">${data.lesson_body}</p>
                    
                    <!-- VISUAL LAB TEST JAR JAVASCRIPT BLOCKS -->
                    <div style="display: flex; gap: 20px; justify-content: center; padding: 15px 0; flex-wrap: wrap;">
                        <div style="background: #f1f2f6; border: 3px solid #a4b0be; border-radius: 20px; width: 140px; padding: 25px 15px; text-align:center; cursor:pointer;" onclick="alert('Solid Test: Atoms are locked tightly! Hard like a real stone brick.')">
                            <div style="font-size:45px; margin-bottom:10px;">🪨</div>
                            <strong style="color:#2c3e50;">Solid Jar</strong>
                        </div>
                        <div style="background: #e0f2fe; border: 3px solid #38bdf8; border-radius: 20px; width: 140px; padding: 25px 15px; text-align:center; cursor:pointer;" onclick="alert('Liquid Test: Flows and shifts shape to fill the bottom of the container!')">
                            <div style="font-size:45px; margin-bottom:10px;">💧</div>
                            <strong style="color:#0369a1;">Liquid Jar</strong>
                        </div>
                        <div style="background: #fee2e2; border: 3px solid #f87171; border-radius: 20px; width: 140px; padding: 25px 15px; text-align:center; cursor:pointer;" onclick="alert('Gas Test: Expands widely to fill the entire air room bounds instantly!')">
                            <div style="font-size:45px; margin-bottom:10px;">💨</div>
                            <strong style="color:#991b1b;">Gas Jar</strong>
                        </div>
                    </div>
                </div>

                <div class="worksheet-paper-container" style="border-top: 8px solid #27ae60; background: #f4fff7;">
                    <h3 style="color: #1e3a8a; margin-top:0;">📝 Matter Detective Lab Log</h3>
                    <p style="color: #334155; font-size: 15px;">${data.interactive_assignment}</p>
                    <button class="audio-banner-btn" style="background:#2ecc71; box-shadow: 0 4px 0 #1b8a4c; margin: 10px auto 0 auto;" onclick="alert('Camera frame activated. Take a picture of an item.')">📸 Take Object Property Photo</button>
                </div>
            </div>`;
    } else {
        // Theme: Living vs Non-Living Drag Grid
        viewport.innerHTML = `
            <div style="animation: slideUp 0.3s ease-out;">
                <button class="audio-banner-btn" onclick="triggerVoiceSynthesis('${data.lesson_body.replace(/'/g, "\\'")}')">🔊 Read Lesson Body Out Loud</button>
                
                <div class="worksheet-paper-container" style="border-top: 8px solid #9c88ff;">
                    <h2 style="margin-top:0; color: #1e293b; font-size: 24px; text-align:center;">🐜 ${data.lesson_title}: Lifecycle Sorting Station</h2>
                    <p style="font-size: 16px; line-height: 1.6; color: #4a5568; margin-bottom: 25px;">${data.lesson_body}</p>
                    
                    <h4 style="color:#6c5ce7; text-align:center; margin-bottom:10px;">Tap each token card below to classify its core environmental lifecycle parameter:</h4>
                    <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; padding: 15px 0;">
                        <button class="audio-banner-btn" style="background:#ffffff; color:#2d3436; border:2px solid #ced6e0; box-shadow:0 4px 0 #b2bec3; margin:0;" onclick="alert('Correct! Ants breathe, consume energy, and replicate.')">🐜 Busy Ant Token</button>
                        <button class="audio-banner-btn" style="background:#ffffff; color:#2d3436; border:2px solid #ced6e0; box-shadow:0 4px 0 #b2bec3; margin:0;" onclick="alert('Correct! Trees grow from seeds and drop leaves.')">🌳 Green Tree Token</button>
                        <button class="audio-banner-btn" style="background:#ffffff; color:#2d3436; border:2px solid #ced6e0; box-shadow:0 4px 0 #b2bec3; margin:0;" onclick="alert('Correct! Cars are static objects made of metal parts, they do not grow.')">🚗 Toy Car Token</button>
                    </div>
                </div>
            </div>`;
    }
}
</script>
<script>
const DISPATCH_THEMES = {
    "mathematics": "#fffbf4",
    "science": "#f4fcf7"
};

function triggerVoiceSynthesis(textToRead) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(textToRead);
        utterance.rate = 0.95;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
    }
}

// Master bootstrap routine to lock in dashboard interactive triggers
window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('grade-selector').addEventListener('change', executeDynamicPortalUpdate);
    document.getElementById('subject-selector').addEventListener('change', executeDynamicPortalUpdate);
    document.getElementById('day-selector').addEventListener('change', executeDynamicPortalUpdate);
    
    // Auto paint the visual worksheets instantly on browser startup
    executeDynamicPortalUpdate();
});
</script>
</body>
</html>
